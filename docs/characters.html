<body>
<a class="skip" href="#main">본문으로</a>
<header id="gnb"></header>

<main id="main">
  <section class="page-head">
    <img class="page-head__bg px" src="assets/img/pic/split.png" alt="">
    <div class="wrap">
      <h1>캐릭터</h1>
      <p>13개 직업. 직업마다 남녀 주인공이 있고, 몬스터는 진화한다.</p>
    </div>
  </section>

  <section class="section select">
    <div class="wrap">
      <div class="roster" id="roster" role="tablist" aria-label="캐릭터 선택"></div>

      <section class="evo win" id="evo" hidden aria-labelledby="evo-title">
        <div class="evo__head">
          <h2 id="evo-title" class="win__title">진화 트리</h2>
          <p class="dim">레벨이 차면 둘 중 하나를 고른다. 마지막 진화 뒤 쉐도우의 부름을 받아 카오스의 옛 왕좌에서 각성한다. 몬스터는 이 각성이 마스터 승급이다. 밤에는 능력치가 오른다.</p>
        </div>
        <div class="evo__body">
          <div class="evo__scroll"><div class="evo__map" id="evo-map"></div></div>
          <aside class="evo__info" id="evo-info" aria-live="polite"></aside>
        </div>
      </section>

      <article class="card win" id="card" aria-live="polite">
        <div class="card__art">
          <img id="c-illust" alt="">
        </div>
        <div class="card__body">
          <p class="card__class"><span id="c-faction" class="faction"></span> <span id="c-class" class="pixel"></span></p>
          <h2 id="c-name"></h2>
          <p id="c-master" class="card__master"></p>
          <p id="c-concept" class="lede"></p>

          <h3 class="win__title" id="c-steps-title">승급</h3>
          <ol class="steps" id="c-steps"></ol>

          <div class="card__cols">
            <div>
              <h3 class="win__title" id="c-skills-title">승급 기술</h3>
              <ul class="skills" id="c-skills"></ul>
            </div>
            <div>
              <h3 class="win__title">초기 능력치</h3>
              <dl class="stats" id="c-stats"></dl>
            </div>
          </div>

          <div class="learn">
            <h3 class="win__title">배우는 기술 <span class="dim">레벨업</span></h3>
            <div class="learn__tabs" id="c-learn-tabs" hidden></div>
            <div class="table-scroll"><table class="table learn__table">
              <thead><tr><th>Lv</th><th>기술</th><th>MP</th><th>설명</th></tr></thead>
              <tbody id="c-learn"></tbody>
            </table></div>
            <div id="c-fuse-box" hidden>
              <h3 class="win__title" style="margin-top:14px">융합·연마 <span class="dim">퓨전의 방·연마의 방에서 두 기술을 하나로</span></h3>
              <table class="table learn__table"><tbody id="c-fuse"></tbody></table>
            </div>
          </div>
        </div>
      </article>
    </div>
  </section>

</main>
